<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Olive & Ember — a little warmth, a lot of flavour. Discover our Mediterranean kitchen."
  >

  <meta name="theme-color" content="#F5EFE3">

  <title>Olive & Ember | Mediterranean Kitchen</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">

      <!-- Brand -->
      <a class="brand" href="#home" aria-label="Olive and Ember home">
        <span class="brand-mark" aria-hidden="true">❧</span>

        <span class="brand-copy">
          <span class="brand-name">
            OLIVE <span class="brand-ampersand">&amp;</span> EMBER
          </span>

          <span class="brand-subtitle">
            MEDITERRANEAN KITCHEN
          </span>
        </span>
      </a>

      <!-- Desktop navigation -->
      <nav class="main-nav" aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#story">Our Story</a>
        <a href="#menu">Menu</a>
        <a href="#reservations">Reservations</a>
        <a href="#gallery">Gallery</a>
        <a href="#location">Location</a>
      </nav>

      <!-- Primary call to action -->
      <a class="button button-primary header-cta" href="#reservations">
        Reserve a Table
        <span class="button-arrow" aria-hidden="true">↗</span>
      </a>

    </div>
  </header>

  <main id="home">
    <section class="header-preview container">
      <p class="eyebrow">MEDITERRANEAN KITCHEN</p>
      <h1>A little warmth, a lot of <em>flavour.</em></h1>
      <p class="preview-copy">
        Seasonal ingredients. Flame-kissed dishes.
        A relaxed space for meaningful moments.
      </p>
      <a class="button button-primary" href="#reservations">
        Reserve a Table
        <span class="button-arrow" aria-hidden="true">↗</span>
      </a>
    </section>
  </main>
</body>
</html>
